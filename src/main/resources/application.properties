# CoolStore Gateway Service - Quarkus Configuration

# HTTP Server
quarkus.http.port=8080

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET

# Catalog Service REST Client
quarkus.rest-client.catalog-service.url=http://${COMPONENT_CATALOG_HOST:localhost}:${COMPONENT_CATALOG_PORT:9000}
quarkus.rest-client.catalog-service.scope=jakarta.inject.Singleton

# Inventory Service REST Client
quarkus.rest-client.inventory-service.url=http://${COMPONENT_INVENTORY_HOST:localhost}:${COMPONENT_INVENTORY_PORT:8080}
quarkus.rest-client.inventory-service.scope=jakarta.inject.Singleton
